name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev
      - name: Provision the exact source build engine
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          bash .github/scripts/provision-mujoco.sh "$target" "$RUNNER_TEMP/mujoco"
          printf 'MUJOCO_DYNAMIC_LINK_DIR=%s/lib\nDYLD_LIBRARY_PATH=%s/lib\nLD_LIBRARY_PATH=%s/lib\n' "$RUNNER_TEMP/mujoco" "$RUNNER_TEMP/mujoco" "$RUNNER_TEMP/mujoco" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
