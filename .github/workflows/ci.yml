name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dev libxkbcommon-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --test runtime_loading
      - run: "cargo test --locked --bin phoxal-simulator lifecycle::"
      - run: "cargo test --locked --bin phoxal-simulator setup::"
      - run: "cargo test --locked --bin phoxal-simulator runtime::body_evidence_tests::cleanup_preserves_primary_failure_and_fences_restart_even_after_cancellation -- --exact"
      - run: "cargo test --locked --bin phoxal-simulator process_output::"
      - run: "cargo test --locked --bin phoxal-simulator native_binding::admission_tests::"
      - run: "cargo test --locked --bin phoxal-simulator config::"
      - run: "cargo test --locked --bin phoxal-simulator cadence::"
      - run: "cargo test --locked --bin phoxal-simulator execution::timing::"
      - run: "cargo test --locked --bin phoxal-simulator execution::interaction::"
      - run: "cargo test --locked --bin phoxal-simulator execution::tests::"
      - run: "cargo test --locked --bin phoxal-simulator desktop::"
      - run: "cargo test --locked --bin phoxal-simulator mujoco::artifact::"
      - run: "cargo test --locked --bin phoxal-simulator bundle::"
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
