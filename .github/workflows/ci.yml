name: simulator-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Simulator-owned CI. The pin is read from Cargo.lock (the resolver of
# truth), the framework checkout is verified against the full SHA, and
# each required test identity is asserted in the harness inventory before
# it is executed. `-- --list` is used for inventory; `--no-run` does not
# produce the harness's test list. Native and rendering configurations
# run as independent matrix entries with fail-fast disabled; a failure
# in one does not prevent the other from collecting evidence.
jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: simulator
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - name: cargo fmt --check
        working-directory: simulator
        run: cargo fmt --all -- --check

  native-build:
    name: cargo build --features native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: simulator
      - name: install pinned native engine
        working-directory: simulator
        run: ./.github/scripts/setup_mujoco.sh "$RUNNER_TEMP/mujoco"
      - name: export engine link variables
        working-directory: simulator
        run: |
          echo "MUJOCO_DYNAMIC_LINK_DIR=$RUNNER_TEMP/mujoco/lib" >> "$GITHUB_ENV"
          if [[ "$(uname -s)" == "Linux" ]]; then
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mujoco/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/mujoco/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo build (native-only, FAIL retained on diagnostics)
        working-directory: simulator
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo build --locked \
            --no-default-features \
            --features native \
            --bin phoxal-simulator-mujoco 2>&1 | tee /tmp/native-build.log
      - name: record native-only build outcome
        working-directory: simulator
        run: |
          set -euo pipefail
          if [[ -f target/debug/phoxal-simulator-mujoco ]] || [[ -f target/release/phoxal-simulator-mujoco ]]; then
            echo "::notice title=native-build-status::PASS"
          else
            echo "::error title=native-build-status::FAIL — native-only build produced no binary"
            echo "Last 80 lines of build log:"
            tail -n 80 /tmp/native-build.log
            exit 1
          fi

  rendering-build:
    name: cargo build --features native,rendering
    runs-on: ubuntu-latest
    # Independent of native-build per reviewer feedback: a failure in
    # native-only must not prevent collecting native+rendering evidence.
    steps:
      - uses: actions/checkout@v4
        with:
          path: simulator
      - name: install pinned native engine
        working-directory: simulator
        run: ./.github/scripts/setup_mujoco.sh "$RUNNER_TEMP/mujoco"
      - name: install rendering prereqs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libwayland-client0
      - name: export engine link variables
        working-directory: simulator
        run: |
          echo "MUJOCO_DYNAMIC_LINK_DIR=$RUNNER_TEMP/mujoco/lib" >> "$GITHUB_ENV"
          if [[ "$(uname -s)" == "Linux" ]]; then
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mujoco/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/mujoco/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo build (native + rendering, FAIL retained on diagnostics)
        working-directory: simulator
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo build --locked \
            --no-default-features \
            --features native,rendering \
            --bin phoxal-simulator-mujoco 2>&1 | tee /tmp/rendering-build.log
      - name: record native+rendering build outcome
        working-directory: simulator
        run: |
          set -euo pipefail
          if [[ -f target/debug/phoxal-simulator-mujoco ]] || [[ -f target/release/phoxal-simulator-mujoco ]]; then
            echo "::notice title=rendering-build-status::PASS"
          else
            echo "::error title=rendering-build-status::FAIL — native+rendering build produced no binary"
            echo "Last 80 lines of build log:"
            tail -n 80 /tmp/rendering-build.log
            exit 1
          fi

  provision-framework:
    name: provision framework from Cargo.lock
    # Single job that checks out the framework at the exact revision
    # recorded in Cargo.lock and verifies the checkout identity. Other
    # test jobs depend on this and on the build they need.
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.resolve.outputs.revision }}
      framework-path: ${{ steps.checkout.outputs.framework-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: simulator
      - name: resolve pinned framework revision from Cargo.lock
        id: resolve
        working-directory: simulator
        run: |
          set -euo pipefail
          # Cargo.lock is the resolver of truth for transitive revisions.
          # The simulator manifest does not declare a `phoxal-framework`
          # dependency by name; the framework is reached transitively via
          # `phoxal`, `phoxal-artifact-format`, and component/service
          # crates. The lockfile URL carries the abbreviated rev and the
          # full SHA after the '#' fragment. We require exactly one match.
          url_pattern='git\+https://github\.com/phoxal/framework\.git\?rev=[0-9a-f]+#[0-9a-f]+'
          matches="$(grep -cE "$url_pattern" Cargo.lock || true)"
          if [[ "$matches" -ne 1 ]]; then
            echo "::error::Expected exactly one framework URL in Cargo.lock, found $matches"
            exit 1
          fi
          full_sha="$(grep -E "$url_pattern" Cargo.lock \
            | head -n1 \
            | sed -E 's/.*#([0-9a-f]+)".*/\1/')"
          if [[ ! "$full_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not extract a 40-char SHA from the framework URL"
            exit 1
          fi
          echo "revision=$full_sha" >> "$GITHUB_OUTPUT"
          echo "Pinned framework revision (full SHA): $full_sha"
      - name: checkout framework at pinned revision
        id: checkout
        uses: actions/checkout@v4
        with:
          repository: phoxal/framework
          ref: ${{ steps.resolve.outputs.revision }}
          path: framework
      - name: verify framework identity
        working-directory: framework
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ steps.resolve.outputs.revision }}"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Framework checkout $actual does not match pinned revision $expected"
            exit 1
          fi
          echo "Framework checkout verified at $actual"
      - name: record framework checkout path
        run: |
          echo "framework-path=$GITHUB_WORKSPACE/framework" >> "$GITHUB_OUTPUT"

  native-tests:
    name: native test identities
    needs: [provision-framework]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: simulator
      - name: install pinned native engine
        working-directory: simulator
        run: ./.github/scripts/setup_mujoco.sh "$RUNNER_TEMP/mujoco"
      - name: export engine link variables
        working-directory: simulator
        run: |
          echo "MUJOCO_DYNAMIC_LINK_DIR=$RUNNER_TEMP/mujoco/lib" >> "$GITHUB_ENV"
          if [[ "$(uname -s)" == "Linux" ]]; then
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mujoco/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/mujoco/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: enumerate and check native test identities
        env:
          MUJOCO_DYNAMIC_LINK_DIR: ${{ runner.temp }}/mujoco/lib
          PHOXAL_TEST_FRAMEWORK_ROOT: ${{ needs.provision-framework.outputs.framework-path }}
        working-directory: simulator
        run: |
          set -euo pipefail
          # `-- --list` invokes the test harness's inventory. `--no-run`
          # only compiles test binaries and would not produce a list of
          # test names.
          cargo test --locked \
            --no-default-features \
            --features native \
            --bin phoxal-simulator-mujoco \
            -- --list 2>&1 | tee /tmp/native-tests.txt

          required_native=(
            official_component_models_compile_from_their_closed_directories
            component_models_leave_the_scene_physics_quantum_to_composition
            official_models_keep_capability_targets_and_native_signal_names
            native_bindings_fail_closed_for_wrong_kinds_and_missing_objects
            native_bindings_read_only_from_their_own_model_snapshot
            scene_owned_custom_metadata_is_read_from_the_compiled_model
            authored_range_sensor_faces_forward_in_the_component_mount_frame
            authored_camera_frames_face_forward_and_preserve_the_known_target_depth
          )
          for required in "${required_native[@]}"; do
            if ! grep -q "$required" /tmp/native-tests.txt; then
              echo "::error::Missing required native test identity: $required"
              exit 1
            fi
            echo "::notice title=native-identity-found::$required"
          done

      - name: execute each required native test identity
        env:
          MUJOCO_DYNAMIC_LINK_DIR: ${{ runner.temp }}/mujoco/lib
          PHOXAL_TEST_FRAMEWORK_ROOT: ${{ needs.provision-framework.outputs.framework-path }}
        working-directory: simulator
        run: |
          set -euo pipefail
          required_native=(
            official_component_models_compile_from_their_closed_directories
            component_models_leave_the_scene_physics_quantum_to_composition
            official_models_keep_capability_targets_and_native_signal_names
            native_bindings_fail_closed_for_wrong_kinds_and_missing_objects
            native_bindings_read_only_from_their_own_model_snapshot
            scene_owned_custom_metadata_is_read_from_the_compiled_model
            authored_range_sensor_faces_forward_in_the_component_mount_frame
            authored_camera_frames_face_forward_and_preserve_the_known_target_depth
          )
          for required in "${required_native[@]}"; do
            cargo test --locked \
              --no-default-features \
              --features native \
              --bin phoxal-simulator-mujoco \
              -- --test-threads=1 "$required"
          done

  rendering-tests:
    name: rendering test identities
    needs: [provision-framework]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: simulator
      - name: install pinned native engine
        working-directory: simulator
        run: ./.github/scripts/setup_mujoco.sh "$RUNNER_TEMP/mujoco"
      - name: install rendering prereqs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libwayland-client0
      - name: export engine link variables
        working-directory: simulator
        run: |
          echo "MUJOCO_DYNAMIC_LINK_DIR=$RUNNER_TEMP/mujoco/lib" >> "$GITHUB_ENV"
          if [[ "$(uname -s)" == "Linux" ]]; then
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/mujoco/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "PKG_CONFIG_PATH=$RUNNER_TEMP/mujoco/lib/pkgconfig" >> "$GITHUB_ENV"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: enumerate and check rendering test identities
        env:
          MUJOCO_DYNAMIC_LINK_DIR: ${{ runner.temp }}/mujoco/lib
          PHOXAL_TEST_FRAMEWORK_ROOT: ${{ needs.provision-framework.outputs.framework-path }}
        working-directory: simulator
        run: |
          set -euo pipefail
          cargo test --locked \
            --no-default-features \
            --features native,rendering \
            --bin phoxal-simulator-mujoco \
            -- --list 2>&1 | tee /tmp/rendering-tests.txt

          required_rendering=(
            native_camera_renders_rgb_and_metric_depth_from_a_private_workspace
            oversized_framebuffer_is_rejected_before_native_allocation
            oversized_capture_is_rejected_before_native_allocation
            no_hit_depth_is_invalid_instead_of_a_fabricated_far_plane_measurement
            cameras_with_different_resolutions_share_a_workspace_without_stale_pixels
          )
          for required in "${required_rendering[@]}"; do
            if ! grep -q "$required" /tmp/rendering-tests.txt; then
              echo "::error::Missing required rendering test identity: $required"
              exit 1
            fi
            echo "::notice title=rendering-identity-found::$required"
          done

      - name: execute each required rendering test identity
        env:
          MUJOCO_DYNAMIC_LINK_DIR: ${{ runner.temp }}/mujoco/lib
          PHOXAL_TEST_FRAMEWORK_ROOT: ${{ needs.provision-framework.outputs.framework-path }}
        working-directory: simulator
        run: |
          set -euo pipefail
          required_rendering=(
            native_camera_renders_rgb_and_metric_depth_from_a_private_workspace
            oversized_framebuffer_is_rejected_before_native_allocation
            oversized_capture_is_rejected_before_native_allocation
            no_hit_depth_is_invalid_instead_of_a_fabricated_far_plane_measurement
            cameras_with_different_resolutions_share_a_workspace_without_stale_pixels
          )
          for required in "${required_rendering[@]}"; do
            cargo test --locked \
              --no-default-features \
              --features native,rendering \
              --bin phoxal-simulator-mujoco \
              -- --test-threads=1 "$required"
          done

  policy:
    name: clippy policy (no-default-features)
    # A bounded lint gate that does not require native setup. Default
    # features are `native`, so this exercises the same toolchain the
    # binary jobs use; failures here reflect the code, not the env.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: simulator
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo clippy --tests --lib --bins
        working-directory: simulator
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo clippy --locked \
            --no-default-features \
            --features native \
            --tests --lib --bins \
            -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: record clippy outcome
        working-directory: simulator
        run: |
          set -euo pipefail
          if grep -E "^error" /tmp/clippy.log; then
            echo "::error title=clippy-status::FAIL"
            tail -n 60 /tmp/clippy.log
            exit 1
          fi
          echo "::notice title=clippy-status::PASS"
