[package]
name = "phoxal-simulator"
version = "0.0.0-dev.2"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
publish = ["phoxal"]
description = "Independent Phoxal MuJoCo simulator application."
documentation = "https://docs.rs/phoxal-simulator"
homepage = "https://github.com/phoxal/simulator"
repository = "https://github.com/phoxal/simulator"

[[bin]]
name = "phoxal-simulator"
path = "src/main.rs"
required-features = ["rendering"]

[features]
default = ["rendering"]
# The native feature is intentionally opt-in so hardware projects and the
# generic framework can compile without a MuJoCo installation or rendering
# stack. The simulator binary requires `native` and builds it by default.
native = ["dep:mujoco-rs"]
rendering = ["native", "dep:cgl", "dep:glutin"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
phoxal = {
    registry = "phoxal",
    version = "=0.0.0-dev.3",
    default-features = false,
    features = ["session", "artifact", "contract", "robotics"],
}
prost = "0.14.4"

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "signal", "sync", "net"] }
thiserror = "2.0.18"
# `mujoco-rs` 6.0.1 is the binding release for MuJoCo 3.12.0.
mujoco-rs = { version = "=6.0.1", optional = true, default-features = false }
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
cgl = { version = "0.3.2", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
glutin = { version = "0.32.3", default-features = false, features = ["egl"], optional = true }

[build-dependencies]
phoxal = { registry = "phoxal", version = "=0.0.0-dev.3", default-features = false, features = ["build"] }

# Native model identity calculations must remain practical in debug builds.
[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
tempfile = "3"
